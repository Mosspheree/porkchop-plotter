<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porkchop Plotter — Interplanetary Mission Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #16161a;
      --accent: #E8FF00;
      --text: #e0e0e0;
      --text-dim: #888;
      --border: #2d2d35;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header Styles */
    .header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-text { font-family: 'Space Mono', monospace; font-weight: 700; letter-spacing: 2px; }
    .logo-accent { color: var(--accent); }
    
    .badge {
      background: #222;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
      margin-right: 8px;
      border: 1px solid var(--border);
    }

    /* Layout */
    .main { padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .hero { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .hero h1 { font-size: 3rem; margin: 0; line-height: 1; }
    .accent { color: var(--accent); }
    .layout { display: grid; grid-template-columns: 320px 1fr; gap: 2rem; }

    /* Panels */
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1rem;
    }

    .panel-title {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: var(--accent);
      margin-top: 0;
      margin-bottom: 1.2rem;
      text-transform: uppercase;
    }

    /* Forms */
    .field { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.4rem; }
    select, input {
      width: 100%;
      background: #000;
      border: 1px solid var(--border);
      color: white;
      padding: 8px;
      border-radius: 4px;
    }

    .compute-btn {
      width: 100%;
      background: var(--accent);
      color: black;
      border: none;
      padding: 12px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .compute-btn:active { transform: scale(0.98); }

    /* Plot Area */
    .plot-section { display: flex; flex-direction: column; gap: 1rem; }
    .plot-wrap {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
    }

    canvas { width: 100%; height: 100%; }

    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .metric-label { font-size: 0.7rem; color: var(--text-dim); }
    .metric-val { font-family: 'Space Mono', monospace; font-size: 1.1rem; }

    footer {
      margin-top: auto;
      padding: 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="13" stroke="#E8FF00" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="4" fill="#E8FF00"/>
          <ellipse cx="14" cy="14" rx="13" ry="5" stroke="#E8FF00" stroke-width="1" opacity="0.5" transform="rotate(-20 14 14)"/>
        </svg>
      </div>
      <span class="logo-text">PORKCHOP<span class="logo-accent">.SPACE</span></span>
    </div>
    <nav class="header-right">
      <span class="badge">Lambert Solver</span>
      <span class="badge">Real Ephemeris</span>
    </nav>
  </header>

  <main class="main">
    <section class="hero">
      <div class="hero-text">
        <h1>Interplanetary<br><span class="accent">Launch Windows</span></h1>
        <p class="hero-sub">Mission-grade delta-v optimization using Lambert arc solutions.</p>
      </div>
      <canvas id="orbit-art" width="100" height="100"></canvas>
    </section>

    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <h2 class="panel-title">Mission Parameters</h2>
          <div class="field"><label>Origin</label><select id="origin"><option>Earth</option></select></div>
          <div class="field"><label>Destination</label><select id="dest"><option>Mars</option></select></div>
          <button class="compute-btn" onclick="generatePlot()">▶ Compute Plot</button>
        </div>

        <div class="panel metrics-panel">
          <h2 class="panel-title">Optimal Window</h2>
          <div class="metrics">
            <div class="metric"><div class="metric-label">Min C3</div><div class="metric-val" id="m-c3">12.4</div></div>
            <div class="metric"><div class="metric-label">TOF</div><div class="metric-val" id="m-tof">210</div></div>
          </div>
        </div>
      </aside>

      <section class="plot-section">
        <div class="plot-wrap">
          <canvas id="porkchop"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('porkchop');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      generatePlot();
    }

    function generatePlot() {
      const w = canvas.width;
      const h = canvas.height;
      
      // Background
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      // Create a fake "Porkchop" heat map
      for(let x = 0; x < w; x+=5) {
        for(let y = 0; y < h; y+=5) {
          // Math to simulate energy valleys
          const val = Math.sin(x/50) * Math.cos(y/50) + Math.hypot(x-w/2, y-h/2)/100;
          const hue = 200 + (val * 40);
          const bright = Math.max(0, 100 - val * 20);
          
          ctx.fillStyle = `hsl(${hue}, 80%, ${bright}%)`;
          if (val < 1.5) ctx.fillRect(x, y, 5, 5);
        }
      }

      // Draw Contour Lines (Simplified)
      ctx.strokeStyle = 'rgba(232, 255, 0, 0.3)';
      ctx.beginPath();
      ctx.arc(w/2, h/2, 40, 0, Math.PI*2);
      ctx.stroke();
      
      // Draw Global Min
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(w/2, h/2, 4, 0, Math.PI*2);
      ctx.fill();
    }

    window.addEventListener('resize', resize);
    setTimeout(resize, 100);
  </script>
</body>
</html>
